<!-- index.html -->
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ocean Health Index</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="container">
<!-- card-->
<section class="card intro sea-img-wrap">
<h1>Voorspel de Biodiversiteit</h1>
<p class="muted">Vul de waarden in en krijg...</p>


<!-- ✨ kleine afbeeldingen rond de card -->
<div class="sea-imgs" aria-hidden="true">
<img src="assets/sea/fish-blue.png" alt="" class="sea-img fish-blue pos-1" />
<img src="assets/sea/turtle.png" alt="" class="sea-img turtle pos-2" />
<img src="assets/sea/jelly.png" alt="" class="sea-img jelly pos-3" />
<img src="assets/sea/coral.png" alt="" class="sea-img coral pos-4" />
<img src="assets/sea/clownfish.png" alt="" class="sea-img clownfish pos-5" />
<img src="assets/sea/star.png" alt="" class="sea-img star pos-6" />
</div>
</section>


<!-- Formulier -->
<section class="card sea-img-wrap" id="predict">
<form id="form-predict">
  <div class="grid">
    <div class="field">
      <label for="HAB">Habitats (0–100)</label>
      <input id="HAB" name="HAB" type="number" min="0" max="100" step="0.1" placeholder="85.0" required />
    </div>
    <div class="field">
      <label for="SPP">Species (0–100)</label>
      <input id="SPP" name="SPP" type="number" min="0" max="100" step="0.1" placeholder="72.0" required />
    </div>
    <div class="field">
      <label for="CS">Carbon Storage (0–100)</label>
      <input id="CS" name="CS" type="number" min="0" max="100" step="0.1" placeholder="60.0" required />
    </div>
    <div class="field">
      <label for="CP">Coastal Protection (0–100)</label>
      <input id="CP" name="CP" type="number" min="0" max="100" step="0.1" placeholder="65.0" required />
    </div>
    <div class="field">
      <label for="CW">Clean Water (0–100)</label>
      <input id="CW" name="CW" type="number" min="0" max="100" step="0.1" placeholder="80.0" required />
    </div>
  </div>

  <div class="action">
    <button type="submit" class="btn primary">Voorspel</button>
  </div>
</form>


<!-- ✨ afbeeldingen rond de formulier-card -->
<div class="sea-imgs" aria-hidden="true">
<img src="assets/sea/fish-blue.png" alt="" class="sea-img fish-blue pos-7" />
<img src="assets/sea/jelly.png" alt="" class="sea-img jelly pos-8" />
<img src="assets/sea/star.png" alt="" class="sea-img star pos-9" />
<img src="assets/sea/coral.png" alt="" class="sea-img coral pos-10" />
</div>
</section>


<!-- Resultaat -->
<section class="card result sea-img-wrap" hidden>
<div id="result-box" class="score" hidden>
    <h1>Het resultaat voor de voorspelling:</h1>
  <div class="score-value" id="score-val">–</div>
  <div class="score-label">Voorspelde Biodiversity (BD)</div>
</div>


<div class="sea-imgs" aria-hidden="true">
<img src="assets/sea/turtle.png" alt="" class="sea-img turtle pos-11" />
<img src="assets/sea/clownfish.png" alt="" class="sea-img clownfish pos-12" />
<img src="assets/sea/fish-blue.png" alt="" class="sea-img fish-blue pos-13" />
</div>
</section>
</main>
</body>
</html>

<script>
const API_URL = "/api/predict"

const form = document.getElementById("form-predict");
const resultSection = document.querySelector(".card.result");
const resultBox = document.getElementById("result-box");
const scoreVal = document.getElementById("score-val");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  // Lees waarden
  const payload = {
    HAB: parseFloat(document.getElementById("HAB").value),
    SPP: parseFloat(document.getElementById("SPP").value),
    CS:  parseFloat(document.getElementById("CS").value),
    CP:  parseFloat(document.getElementById("CP").value),
    CW:  parseFloat(document.getElementById("CW").value),
  };

  // Call backend
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || "Server error");
    }

    const data = await res.json();
    const pred = Number(data.prediction);

    // Toon resultaat
    scoreVal.textContent = pred.toFixed(2);
    resultSection.hidden = false;
    resultBox.hidden = false;
    resultSection.scrollIntoView({behavior: "smooth", block: "center"});
  } catch (err) {
    scoreVal.textContent = "Error";
    resultSection.hidden = false;
    resultBox.hidden = false;
    console.error(err);
    alert("Kon niet voorspellen: " + err.message);
  }
});
</script>
